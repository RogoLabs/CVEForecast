name: CVE Forecast Daily Update

on:
  push:
    branches: [main, master]
  schedule:
    # Run daily at midnight UTC
    - cron: "0 0 * * *"

  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Clone CVE data repository
        run: |
          set -euo pipefail

          retry_git() {
            local attempt=1
            local max_attempts=3
            while [ "$attempt" -le "$max_attempts" ]; do
              if "$@"; then
                return 0
              fi
              echo "Git command failed (attempt ${attempt}/${max_attempts}): $*"
              attempt=$((attempt + 1))
              sleep 5
            done
            return 1
          }

          if [ -d cvelistV5/.git ]; then
            retry_git git -C cvelistV5 fetch --depth 1 origin
            git -C cvelistV5 reset --hard FETCH_HEAD
          else
            rm -rf cvelistV5
            retry_git git clone --depth 1 https://github.com/CVEProject/cvelistV5.git cvelistV5
          fi
          echo "CVE data ready at commit $(git -C cvelistV5 rev-parse --short HEAD)"
          ls -la cvelistV5/

      - name: Run CVE forecast
        run: |
          python code/run_production_forecast.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Validate forecast data
        run: python code/scripts/validate_forecast_data.py

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain -- web/data.json web/cna_data.json web/forecast_history.json web/pipeline_results.json web/model_info.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git add web/data.json web/cna_data.json web/forecast_history.json web/pipeline_results.json web/model_info.json
          if git diff --cached --quiet; then
            echo "No tracked forecast changes to commit"
            exit 0
          fi
          git commit -m "Update CVE forecast data - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          max_attempts=3
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push succeeded on attempt ${attempt}/${max_attempts}"
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}/${max_attempts}); fetching and rebasing onto origin/${GITHUB_REF_NAME}"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            attempt=$((attempt + 1))
          done

          echo "Push failed after ${max_attempts} attempts"
          exit 1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forecast-data
          path: web/data.json
          retention-days: 30

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
