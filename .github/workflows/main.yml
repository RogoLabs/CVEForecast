name: CVE Forecast Daily Update

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    # Run daily at midnight UTC
    - cron: "0 0 * * *"

  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Clone CVE data repository
        run: |
          set -euo pipefail

          retry_git() {
            local attempt=1
            local max_attempts=3
            while [ "$attempt" -le "$max_attempts" ]; do
              if "$@"; then
                return 0
              fi
              echo "Git command failed (attempt ${attempt}/${max_attempts}): $*"
              attempt=$((attempt + 1))
              sleep 5
            done
            return 1
          }

          # Ensure we have latest workflows by fetching main
          git fetch origin main

          if [ -d cvelistV5/.git ]; then
            retry_git git -C cvelistV5 fetch --depth 1 origin
            git -C cvelistV5 reset --hard FETCH_HEAD
          else
            rm -rf cvelistV5
            retry_git git clone --depth 1 https://github.com/CVEProject/cvelistV5.git cvelistV5
          fi
          echo "CVE data ready at commit $(git -C cvelistV5 rev-parse --short HEAD)"
          ls -la cvelistV5/

      - name: Run CVE forecast
        run: |
          python code/run_production_forecast.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Validate forecast data
        run: python code/scripts/validate_forecast_data.py

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain -- web/data.json web/cna_data.json web/forecast_history.json web/pipeline_results.json web/model_info.json web/validation.json web/data_vintages.json web/cna_model_selection.json code/cna_count_cache.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git add web/data.json web/cna_data.json web/forecast_history.json web/pipeline_results.json web/model_info.json web/validation.json web/data_vintages.json web/cna_model_selection.json code/cna_count_cache.json
          if git diff --cached --quiet; then
            echo "No tracked forecast changes to commit"
            exit 0
          fi
          git commit -m "Update CVE forecast data - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          max_attempts=3
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push succeeded on attempt ${attempt}/${max_attempts}"
              exit 0
            fi

            echo "Push failed (attempt ${attempt}/${max_attempts}); resetting and retrying"

            # Guarded because the step runs under `set -e`: a push can fail for
            # reasons that also break the fetch, and an unguarded fetch then
            # aborts the whole step rather than reaching attempt 2. On
            # 2026-09-19 DNS went down mid-push, `git fetch` died with "Could
            # not resolve host", and a loop advertising three attempts delivered
            # one - a retryable blip turned into a failed run and a day of stale
            # data.
            if ! git fetch origin "${GITHUB_REF_NAME}"; then
              echo "Could not reach the remote; waiting before the next attempt"
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
              continue
            fi

            git reset --hard "origin/${GITHUB_REF_NAME}"
            git add web/data.json web/cna_data.json web/forecast_history.json web/pipeline_results.json web/model_info.json web/validation.json web/data_vintages.json web/cna_model_selection.json code/cna_count_cache.json
            git commit -m "Update CVE forecast data - $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || {
              echo "No changes after reset; exiting cleanly"
              exit 0
            }
            attempt=$((attempt + 1))
          done

          echo "Push failed after ${max_attempts} attempts"
          exit 1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forecast-data
          path: web/data.json
          retention-days: 30

      # The ?v= query on every CSS/JS tag used to be hand-edited in 11 places
      # across four HTML files, and getting it wrong pairs new markup with a
      # cached script - a blank page, not a subtle regression.
      #
      # Two things make this correct rather than merely automatic:
      #
      # It runs AFTER the commit-and-push step, because that step's retry loop
      # does `git reset --hard`, which would discard a stamp applied earlier.
      # Stamping here also keeps the churn out of git history: only the deployed
      # artifact carries the version, the committed HTML keeps the placeholder.
      #
      # And it stamps from the last commit that TOUCHED an asset, not from
      # GITHUB_SHA. GITHUB_SHA advances on every daily data commit, so using it
      # would re-bust the cache every single day for every visitor and defeat
      # the caching it exists to manage.
      - name: Stamp asset cache-busting version
        run: |
          set -euo pipefail

          ASSET_VERSION="$(git log -1 --format=%h -- \
            web/app.css web/shell.js web/app.js web/cna.js web/history.js)"
          if [ -z "$ASSET_VERSION" ]; then
            echo "Could not determine an asset version from git history" >&2
            exit 1
          fi

          echo "Stamping assets as ?v=${ASSET_VERSION}"
          find web -name '*.html' -print0 \
            | xargs -0 sed -i "s/__ASSET_VERSION__/${ASSET_VERSION}/g"

          # An unstamped page still loads, so a silently broken step would go
          # unnoticed until someone got a stale script. Fail loudly instead.
          if grep -rq '__ASSET_VERSION__' web/*.html; then
            echo "Some asset references were left unstamped:" >&2
            grep -rn '__ASSET_VERSION__' web/*.html >&2
            exit 1
          fi
          echo "Stamped $(grep -rho "?v=${ASSET_VERSION}" web/*.html | wc -l) asset references"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
