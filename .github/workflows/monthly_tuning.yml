name: Monthly Hyperparameter Tuning

on:
  push:
    branches: [ main, master ]
  schedule:
    # Run on the 1st of each month at 2 AM UTC
    - cron: '0 2 1 * *'
  
  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  tune-hyperparameters:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt
    
    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Prepare CVE data repository
      run: |
        if [ -d cvelistV5 ]; then
          rm -rf cvelistV5
        fi
        git clone --depth 1 https://github.com/CVEProject/cvelistV5.git cvelistV5
        echo "CVE data cloned successfully"
        ls -la cvelistV5/

    - name: Normalize tuner file paths
      run: |
        python - <<'PY'
        import json
        import os
        import pathlib

        cfg_path = pathlib.Path("code/tuner/tuner_config.json")
        data = json.loads(cfg_path.read_text())
        workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])

        updated = False
        for key, rel in data.get("file_paths", {}).items():
            abs_path = (workspace / rel).resolve()
            if data["file_paths"][key] != str(abs_path):
                data["file_paths"][key] = str(abs_path)
                updated = True

        if updated:
            cfg_path.write_text(json.dumps(data, indent=2))
        PY
      env:
        GITHUB_WORKSPACE: ${{ github.workspace }}
    
    - name: Run Comprehensive Hyperparameter Tuning
      run: |
        python code/tuner/comprehensive_tuner.py
      env:
        PYTHONUNBUFFERED: 1
      timeout-minutes: 300  # 5 hours max
    
    - name: Check for config changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain code/config.json)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "✅ Hyperparameter tuning completed - config.json updated"
        else
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "ℹ️ No changes to hyperparameters"
        fi
    
    - name: Commit and push optimized configurations
      if: steps.verify-changed-files.outputs.changed == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git add code/config.json
        git commit -m "🔧 Update optimized hyperparameters - Monthly tuning $(date -u '+%Y-%m-%d')"
        git push
    
    - name: Generate tuning report
      if: always()
      run: |
        python - <<'PY'
        import datetime as dt
        import json
        import os
        import pathlib

        workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
        logs_dir = workspace / "code" / "tuner" / "logs"
        logs_dir.mkdir(parents=True, exist_ok=True)

        status = os.environ["JOB_STATUS"]
        now = dt.datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC")

        summary_lines = [
            "# Hyperparameter Tuning Summary",
            "",
            f"**Date:** {now}",
            f"**Status:** {status}",
            ""
        ]

        config_path = workspace / "code" / "config.json"
        if config_path.exists():
            data = json.loads(config_path.read_text())
            models = sorted(data.get("models", {}).keys())
            summary_lines.append("## Models in config.json")
            summary_lines.extend([f"- {model}" for model in models])
            summary_lines.append("")

        (workspace / "tuning_summary.md").write_text("\n".join(summary_lines))

        status_payload = {
            "status": status,
            "generated_at": dt.datetime.utcnow().isoformat() + "Z"
        }
        (workspace / "tuning_status.json").write_text(json.dumps(status_payload, indent=2))
        PY
      env:
        GITHUB_WORKSPACE: ${{ github.workspace }}
        JOB_STATUS: ${{ job.status }}
    
    - name: Upload tuning artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tuning-results-${{ github.run_number }}
        path: |
          code/config.json
          tuning_summary.md
          tuning_status.json
          code/tuner/logs/
        retention-days: 90
