name: Monthly Hyperparameter Tuning

on:
  push:
    branches: [main, master]
  schedule:
    # Run on the 1st of each month at 2 AM UTC
    - cron: "0 2 1 * *"

  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: "monthly-tuning-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  tune-hyperparameters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Prepare CVE data repository
        run: |
          set -euo pipefail

          retry_git() {
            local attempt=1
            local max_attempts=3
            while [ "$attempt" -le "$max_attempts" ]; do
              if "$@"; then
                return 0
              fi
              echo "Git command failed (attempt ${attempt}/${max_attempts}): $*"
              attempt=$((attempt + 1))
              sleep 5
            done
            return 1
          }

          if [ -d cvelistV5/.git ]; then
            retry_git git -C cvelistV5 fetch --depth 1 origin
            git -C cvelistV5 reset --hard FETCH_HEAD
          else
            rm -rf cvelistV5
            retry_git git clone --depth 1 https://github.com/CVEProject/cvelistV5.git cvelistV5
          fi
          echo "CVE data ready at commit $(git -C cvelistV5 rev-parse --short HEAD)"
          ls -la cvelistV5/

      - name: Normalize tuner file paths
        run: python code/scripts/normalize_tuner_paths.py
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Run Comprehensive Hyperparameter Tuning
        run: |
          python code/tuner/comprehensive_tuner.py
        env:
          PYTHONUNBUFFERED: 1
        timeout-minutes: 300 # 5 hours max

      - name: Check for config changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain code/config.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Hyperparameter tuning completed - config.json updated"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes to hyperparameters"
          fi

      - name: Commit and push optimized configurations
        if: steps.verify-changed-files.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add code/config.json
          if git diff --cached --quiet; then
            echo "No config changes to commit"
            exit 0
          fi
          git commit -m "🔧 Update optimized hyperparameters - Monthly tuning $(date -u '+%Y-%m-%d')"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Generate tuning report
        if: always()
        run: python code/scripts/generate_tuning_report.py
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          JOB_STATUS: ${{ job.status }}

      - name: Upload tuning artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tuning-results-${{ github.run_number }}
          path: |
            code/config.json
            tuning_summary.md
            tuning_status.json
            code/tuner/logs/
          retention-days: 90
