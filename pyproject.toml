[project]
name = "cveforecast"
version = "0.11.0"
description = "Predictive analytics for CVE publications using machine learning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These files need sys.path manipulation before imports
"code/run_production_forecast.py" = ["E402"]
"code/run_unified_pipeline.py" = ["E402"]
"code/tuner/comprehensive_tuner.py" = ["E402", "E722"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring CVE data",
]
addopts = "-v --tb=short"
